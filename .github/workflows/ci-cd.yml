name: CI/CD

on:
  push:
    branches:
      - main
      - feature/mini-app-migration
  pull_request:
    branches:
      - main
      - feature/mini-app-migration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: listik-bot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras --python 3.11

      - name: Run tests
        run: uv run pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

  image:
    name: Build Docker image
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: listik-bot:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs:
      - backend
      - frontend
      - image
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/mini-app-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_BRANCH: feature/mini-app-migration
    steps:
      - name: Check deployment configuration
        id: deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "$VPS_HOST$VPS_USER$VPS_PATH$VPS_SSH_KEY$VPS_KNOWN_HOSTS" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "VPS secrets are not configured; deployment is skipped."
            exit 0
          fi
          if [[ -z "$VPS_HOST" || -z "$VPS_USER" || -z "$VPS_PATH" || -z "$VPS_SSH_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "All VPS secrets must be configured to enable deployment." >&2
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to VPS
        if: steps.deployment.outputs.configured == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$VPS_SSH_KEY"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_PATH' && \
             git pull --ff-only origin '$DEPLOY_BRANCH' && \
             docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d --build && \
             curl --fail --silent --show-error --connect-timeout 5 --max-time 15 https://$VPS_HOST:8443/healthz"
